<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braille Alphabet Pattern Recognition Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen text-white">
<div class="max-w-lg mx-auto p-4">
  <header class="mb-4 text-center">
    <h1 class="text-2xl font-bold text-yellow-300">Braille Alphabet Quiz</h1>
    <p class="text-gray-400 text-sm mt-1">Grade 1 Braille — identify the letter from the dot pattern</p>
  </header>

  <!-- Mode Toggle -->
  <div class="flex gap-2 justify-center mb-4">
    <button onclick="setMode('recognize')" id="btnRecognize" class="px-4 py-1.5 rounded-full text-sm font-medium bg-yellow-400 text-gray-900">Braille → Letter</button>
    <button onclick="setMode('reverse')" id="btnReverse" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-700 text-gray-300">Letter → Braille</button>
    <button onclick="setMode('hard')" id="btnHard" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-700 text-gray-300">Hardest Letters</button>
  </div>

  <!-- Stats -->
  <div class="flex justify-around bg-gray-800 rounded-xl p-3 mb-4">
    <div class="text-center"><div class="text-xl font-bold text-green-400" id="correct">0</div><div class="text-xs text-gray-500">Correct</div></div>
    <div class="text-center"><div class="text-xl font-bold text-red-400" id="wrong">0</div><div class="text-xs text-gray-500">Wrong</div></div>
    <div class="text-center"><div class="text-xl font-bold text-yellow-400" id="streak">0</div><div class="text-xs text-gray-500">Streak</div></div>
    <div class="text-center"><div class="text-xl font-bold text-blue-400" id="best">0</div><div class="text-xs text-gray-500">Best</div></div>
  </div>

  <!-- Card -->
  <div class="bg-gray-800 rounded-2xl p-6 mb-4 text-center shadow-xl">
    <div id="questionLabel" class="text-xs text-gray-400 uppercase tracking-widest mb-4"></div>

    <!-- Braille Cell Display -->
    <div id="brailleDisplay" class="flex justify-center mb-2">
      <div id="brailleCell" class="grid gap-3 p-4 bg-gray-700 rounded-xl inline-grid" style="grid-template-columns: repeat(2, 1fr);">
      </div>
    </div>

    <!-- Letter display (for reverse mode) -->
    <div id="letterDisplay" class="text-8xl font-black text-yellow-300 hidden mb-2"></div>

    <div id="feedback" class="font-semibold text-lg mt-3 hidden" aria-live="polite"></div>
  </div>

  <!-- Answer Section -->
  <!-- Recognize mode: click letter grid -->
  <div id="letterGrid" class="grid grid-cols-6 gap-1.5 mb-4">
  </div>

  <!-- Reverse mode: dot input -->
  <div id="dotInput" class="hidden mb-4">
    <p class="text-sm text-gray-400 mb-2 text-center">Click dots to build the Braille pattern</p>
    <div class="flex justify-center mb-3">
      <div id="dotGrid" class="grid gap-3 p-4 bg-gray-700 rounded-xl inline-grid" style="grid-template-columns: repeat(2, 1fr);">
      </div>
    </div>
    <button onclick="checkDots()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold py-2 rounded-xl transition">Check Pattern</button>
    <button onclick="clearDots()" class="w-full mt-2 bg-gray-700 hover:bg-gray-600 text-gray-300 py-1.5 rounded-xl text-sm transition">Clear Dots</button>
  </div>

  <button id="nextBtn" onclick="nextCard()" class="hidden w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold py-3 rounded-xl transition">Next →</button>
</div>

<script>
// Grade 1 Braille: dots numbered 1-6 (left col top-bottom: 1,2,3; right col: 4,5,6)
// Pattern: array of raised dot numbers
const BRAILLE = {
  A:[1], B:[1,2], C:[1,4], D:[1,4,5], E:[1,5],
  F:[1,2,4], G:[1,2,4,5], H:[1,2,5], I:[2,4], J:[2,4,5],
  K:[1,3], L:[1,2,3], M:[1,3,4], N:[1,3,4,5], O:[1,3,5],
  P:[1,2,3,4], Q:[1,2,3,4,5], R:[1,2,3,5], S:[2,3,4], T:[2,3,4,5],
  U:[1,3,6], V:[1,2,3,6], W:[2,4,5,6], X:[1,3,4,6], Y:[1,3,4,5,6], Z:[1,3,5,6]
};
const LETTERS = Object.keys(BRAILLE);
const STORAGE_KEY = 'braille_v1';

function loadStats() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function saveStats(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

let stats = loadStats();
let mode = 'recognize';
let currentLetter = '';
let answered = false;
let cCorrect = 0, cWrong = 0, cStreak = 0, cBest = 0;
let userDots = [];

function dotPos(dot) {
  // dot 1-6 → {col, row} in 2-col grid
  // col0: dots 1,2,3 (rows 0,1,2); col1: dots 4,5,6 (rows 0,1,2)
  const col = dot <= 3 ? 0 : 1;
  const row = dot <= 3 ? dot - 1 : dot - 4;
  return { col, row };
}

function renderBrailleCell(raised, container, clickable = false) {
  let html = '';
  for (let dot = 1; dot <= 6; dot++) {
    const isRaised = raised.includes(dot);
    const dp = dotPos(dot);
    const base = 'w-7 h-7 rounded-full border-2 transition cursor-default select-none';
    const cls = isRaised
      ? `${base} bg-yellow-300 border-yellow-400 shadow-lg`
      : `${base} bg-gray-600 border-gray-500 opacity-40`;
    const click = clickable ? `onclick="toggleDot(${dot})" style="cursor:pointer"` : '';
    const order = `style="grid-row:${dp.row+1};grid-column:${dp.col+1};${clickable?'cursor:pointer':''}"`
    html += `<div class="${cls}" ${click} data-dot="${dot}" style="grid-row:${dp.row+1};grid-column:${dp.col+1};${clickable?'cursor:pointer':''}" aria-label="Dot ${dot} ${isRaised?'raised':'not raised'}"></div>`;
  }
  container.innerHTML = html;
  container.style.gridTemplateRows = 'repeat(3, 1fr)';
}

function setMode(m) {
  mode = m;
  ['Recognize','Reverse','Hard'].forEach(n => {
    const btn = document.getElementById('btn'+n);
    if (n.toLowerCase() === m) btn.className = 'px-4 py-1.5 rounded-full text-sm font-medium bg-yellow-400 text-gray-900';
    else btn.className = 'px-4 py-1.5 rounded-full text-sm font-medium bg-gray-700 text-gray-300';
  });
  nextCard();
}

function getPool() {
  if (mode === 'hard') {
    // Letters with highest error rate
    const ranked = LETTERS.map(l => {
      const s = stats[l] || { correct:0, wrong:0 };
      const t = s.correct + s.wrong;
      return { l, rate: t > 0 ? s.wrong/t : 0.5 };
    }).sort((a,b) => b.rate - a.rate).slice(0, 10);
    return ranked.map(r => r.l);
  }
  return LETTERS;
}

function pickLetter() {
  const pool = getPool();
  if (mode === 'hard' && pool.length > 0) {
    const weights = pool.map(l => {
      const s = stats[l] || { correct:0, wrong:0 };
      const t = s.correct + s.wrong;
      return 1 + (t > 0 ? s.wrong/t : 0.5) * 3;
    });
    const sum = weights.reduce((a,b)=>a+b,0);
    let r = Math.random() * sum;
    for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildLetterGrid() {
  const grid = document.getElementById('letterGrid');
  grid.innerHTML = LETTERS.map(l =>
    `<button onclick="guessLetter('${l}')" id="lb_${l}"
      class="bg-gray-700 hover:bg-yellow-500 hover:text-gray-900 border border-gray-600 rounded-lg py-2 text-sm font-bold transition"
      aria-label="Letter ${l}">${l}</button>`
  ).join('');
}

function nextCard() {
  answered = false;
  userDots = [];
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');

  currentLetter = pickLetter();
  const dots = BRAILLE[currentLetter];

  buildLetterGrid();

  if (mode === 'reverse') {
    document.getElementById('questionLabel').textContent = 'Arrange the Braille dots for:';
    document.getElementById('brailleDisplay').classList.add('hidden');
    document.getElementById('letterDisplay').classList.remove('hidden');
    document.getElementById('letterDisplay').textContent = currentLetter;
    document.getElementById('letterGrid').classList.add('hidden');
    document.getElementById('dotInput').classList.remove('hidden');
    renderBrailleCell([], document.getElementById('dotGrid'), true);
  } else {
    document.getElementById('questionLabel').textContent = 'Which letter is this Braille pattern?';
    document.getElementById('brailleDisplay').classList.remove('hidden');
    document.getElementById('letterDisplay').classList.add('hidden');
    document.getElementById('letterGrid').classList.remove('hidden');
    document.getElementById('dotInput').classList.add('hidden');
    renderBrailleCell(dots, document.getElementById('brailleCell'), false);
  }
}

function guessLetter(letter) {
  if (answered) return;
  answered = true;
  const isCorrect = letter === currentLetter;
  handleResult(isCorrect, letter);

  document.querySelectorAll('#letterGrid button').forEach(b => {
    const l = b.textContent.trim();
    if (l === currentLetter) b.className = b.className.replace('bg-gray-700','bg-green-600').replace('hover:bg-yellow-500','').replace('hover:text-gray-900','');
    if (l === letter && !isCorrect) b.className = b.className.replace('bg-gray-700','bg-red-600').replace('hover:bg-yellow-500','').replace('hover:text-gray-900','');
    b.disabled = true;
  });
}

function toggleDot(dot) {
  if (answered) return;
  if (userDots.includes(dot)) userDots = userDots.filter(d => d !== dot);
  else userDots.push(dot);
  renderBrailleCell(userDots, document.getElementById('dotGrid'), true);
}

function clearDots() { userDots = []; renderBrailleCell([], document.getElementById('dotGrid'), true); }

function checkDots() {
  if (answered) return;
  answered = true;
  const expected = BRAILLE[currentLetter].sort((a,b)=>a-b).join(',');
  const got = [...userDots].sort((a,b)=>a-b).join(',');
  handleResult(expected === got, null);
  // Show correct pattern
  renderBrailleCell(BRAILLE[currentLetter], document.getElementById('dotGrid'), false);
}

function handleResult(isCorrect, guessed) {
  const feedEl = document.getElementById('feedback');
  if (!stats[currentLetter]) stats[currentLetter] = { correct:0, wrong:0 };
  if (isCorrect) {
    cCorrect++; cStreak++; cBest = Math.max(cBest, cStreak);
    stats[currentLetter].correct++;
    feedEl.textContent = `✓ Correct! — ${currentLetter}`;
    feedEl.className = 'font-semibold text-lg mt-3 text-green-400';
  } else {
    cWrong++; cStreak = 0;
    stats[currentLetter].wrong++;
    feedEl.textContent = `✗ Incorrect. The answer is "${currentLetter}"`;
    feedEl.className = 'font-semibold text-lg mt-3 text-red-400';
  }
  feedEl.classList.remove('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  saveStats(stats);

  document.getElementById('correct').textContent = cCorrect;
  document.getElementById('wrong').textContent = cWrong;
  document.getElementById('streak').textContent = cStreak;
  document.getElementById('best').textContent = cBest;
}

buildLetterGrid();
nextCard();
</script>
</body>
</html>
